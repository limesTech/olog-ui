# -------------------------------------------------
#  Front‑end SPA (already present)
# -------------------------------------------------
server {
    listen 8080;

    # SPA – unchanged
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------
    #  CORS / API proxy to Olog
    # -------------------------------------------------
    # All Olog calls are under the same path you currently use.
    # Adjust the prefix if your API lives somewhere else.
    location /Olog/ {
        # 1️⃣ Respond to pre‑flight without touching the back‑end
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080";
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Access-Control-Allow-Credentials "true";
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        # 2️⃣ Proxy normal requests (GET/POST/etc.) to the internal Olog service
        proxy_pass          http://olog:8081;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # 3️⃣ Ensure CORS headers also appear on non‑OPTIONS responses
        #    (including 401/403). The add_header directive with "always"
        #    makes it apply even on error responses.
        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # -------------------------------------------------
    #  Static assets cache (you already changed to 1 week)
    # -------------------------------------------------
    location /static {
        expires 1d;
        add_header Cache-Control "public";
    }
}