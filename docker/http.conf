server {
    listen 80;

    # SPA – serve index.html for all routes
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------
    #  Proxy /Olog/ API requests to the Olog service
    # -------------------------------------------------
    location /Olog/ {
        # 1️⃣ Handle preflight OPTIONS requests (no auth needed)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://mesalogger.mesa.kph";
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Access-Control-Allow-Credentials "true";
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        # 2️⃣ Proxy normal requests to Olog (running on localhost:8081)
        proxy_pass          http://localhost:8081;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # 3️⃣ Add CORS headers to ALL responses (including 401/403)
        add_header Access-Control-Allow-Origin "http://mesalogger.mesa.kph" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # -------------------------------------------------
    #  Static assets cache (1 day for now)
    # -------------------------------------------------
    location /static {
        expires 1d;
        add_header Cache-Control "public";
    }
}