version: '3.8'

services:
  olog-ui:
    image: ghcr.io/limestech/olog-ui/docker:adjustments
    container_name: olog-ui
    volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/ssl
      - ./nginx/logs:/var/log/nginx
    env_file:
      - .env.docker
    ports:
      - "443:443"
    restart: unless-stopped
